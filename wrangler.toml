name = "one-ip"
main = "worker/index.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[vars]
TIANDITU_TOKEN = "bed2c92db1541f2af8b80a1fcccbeb13"
TURNSTILE_SITE_KEY = "0x4AAAAAAAFjLuzCgIGYzh34U"
TURNSTILE_HOSTNAMES = "ip-test.tesseract.kdns.fr"
RECAPTCHA_SITE_KEY = "6LfMC_4tAAAAAPIAZIoXAQ13baZgmfTzeTxObk2M"
RECAPTCHA_HOSTNAMES = "ip-test.tesseract.kdns.fr"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/worker", "/worker/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false

[observability.traces]
enabled = false

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ICON_LIMITER"
namespace_id = "1003"
simple = { limit = 180, period = 60 }

# Local development forwards all page and asset requests to Vite.
[env.local.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.local.ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[env.local.ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.local.ratelimits]]
name = "ICON_LIMITER"
namespace_id = "1003"
simple = { limit = 180, period = 60 }
